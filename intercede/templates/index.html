<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intercede</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
<h1>Intercede</h1>
<p class="sub">News from a place that needs prayer.</p>
<label for="city">Choose a city</label>
<select id="city">
<option value="Paris|France">Paris, France</option>
<option value="London|United Kingdom">London, United Kingdom</option>
</select>
<div id="status" role="status"></div>
<section id="stories" aria-label="Stories"></section>
<h2>Prayer list</h2>
<section id="list" aria-label="Prayer list"></section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
